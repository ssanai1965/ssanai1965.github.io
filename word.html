let currentPart = 1;
let currentList = [...part1];
let idx = 0, show = false;

function render() {
  const item = currentList[idx];
  document.getElementById("page").innerText = `${idx + 1} / ${currentList.length}`;
  document.getElementById("kanji").innerText = item.k;
  document.getElementById("kana").innerText = item.r;
  document.getElementById("meaning").innerText = show ? item.m : "탭하여 뜻 보기";
  document.getElementById("meaning").style.color = show ? "#28a745" : "#aaa";
  document.getElementById("ex-jp").innerText = item.ej;
  document.getElementById("ex-kr").innerText = show ? item.ek : "···";
}

function switchPart(num) {
  currentPart = num;
  if (num === 1) currentList = [...part1];
  else if (num === 2) currentList = [...part2];
  else if (num === 3) currentList = [...part3];
  else if (num === 4) currentList = [...part4];

  idx = 0;
  show = false;
  
  const btns = document.querySelectorAll(".tab-btn");
  btns.forEach((b, i) => {
    b.classList.toggle("active", i + 1 === num);
  });
  render();
}

function toggleMeaning() { show = !show; render(); }
function next() { idx = (idx + 1) % currentList.length; show = false; render(); }
function prev() { idx = (idx - 1 + currentList.length) % currentList.length; show = false; render(); }

function speakWord() {
  const u = new SpeechSynthesisUtterance(currentList[idx].r);
  u.lang = 'ja-JP';
  speechSynthesis.speak(u);
}

function speakEx() {
  const u = new SpeechSynthesisUtterance(currentList[idx].ej);
  u.lang = 'ja-JP';
  speechSynthesis.speak(u);
}

function shuffle() {
  for (let i = currentList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
  }
  idx = 0;
  show = false;
  render();
}
